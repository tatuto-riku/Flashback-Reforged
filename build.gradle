plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'com.gradleup.shadow' version '9.2.2'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        content {
            includeGroup("me.djtheredstoner")
        }
    }
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = "https://maven.bawnorton.com/releases"
        content {
            includeGroup("com.github.bawnorton.mixinsquared")
        }
    }
    mavenLocal()
}

neoForge {
    version = project.neo_version

    accessTransformers {
        publish(project.file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    mods {
        flashback_reforged {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

dependencies {
    // Development auth
    runtimeOnly("me.djtheredstoner:DevAuth-neoforge:1.1.2")

    // MixinConstraints
    jarJar(implementation("com.moulberry:mixinconstraints:1.0.8"))

    // MixinSquared - NeoForge version
    jarJar(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1")))

    // Lattice (config)
    jarJar(implementation("com.moulberry:lattice:1.3.1") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    })

    // Commons math
    shadow(implementation("org.apache.commons:commons-math3:3.6.1"))

    // Mod compatibility - NeoForge versions
    compileOnly("maven.modrinth:distanthorizons:Mt9bDAs6")
    compileOnly("maven.modrinth:sodium:RncWhTxD")
    compileOnly("maven.modrinth:iris:l77DAK6U")
    compileOnly("maven.modrinth:bobby:2cuVyTav")
    compileOnly("maven.modrinth:simple-voice-chat:pTfXZIdn")
    compileOnly("maven.modrinth:replaymod:NtlpUQgI")
//    compileOnly("maven.modrinth:starlight:1.1.3+1.20.2")

    // FFmpeg
    shadow(implementation("org.bytedeco:javacv-platform:1.5.10") {
        exclude group: "org.bytedeco", module: "artoolkitplus"
        exclude group: "org.bytedeco", module: "artoolkitplus-platform"
        exclude group: "org.bytedeco", module: "flycapture"
        exclude group: "org.bytedeco", module: "flycapture-platform"
        exclude group: "org.bytedeco", module: "leptonica"
        exclude group: "org.bytedeco", module: "leptonica-platform"
        exclude group: "org.bytedeco", module: "libdc1394"
        exclude group: "org.bytedeco", module: "libdc1394-platform"
        exclude group: "org.bytedeco", module: "libfreenect"
        exclude group: "org.bytedeco", module: "libfreenect-platform"
        exclude group: "org.bytedeco", module: "libfreenect2"
        exclude group: "org.bytedeco", module: "libfreenect2-platform"
        exclude group: "org.bytedeco", module: "librealsense2"
        exclude group: "org.bytedeco", module: "librealsense2-platform"
        exclude group: "org.bytedeco", module: "librealsense"
        exclude group: "org.bytedeco", module: "librealsense-platform"
        exclude group: "org.bytedeco", module: "openblas"
        exclude group: "org.bytedeco", module: "openblas-platform"
        exclude group: "org.bytedeco", module: "opencv"
        exclude group: "org.bytedeco", module: "opencv-platform"
        exclude group: "org.bytedeco", module: "tesseract"
        exclude group: "org.bytedeco", module: "tesseract-platform"
        exclude group: "org.bytedeco", module: "videoinput"
        exclude group: "org.bytedeco", module: "videoinput-platform"
    })

    // ImGui
    shadow(implementation(rootProject.files('deps/imgui-binding-1.90.0.jar')))
    shadow(api(rootProject.files('deps/imgui-natives.jar')))

    // Native File Dialogs
    String nfdVersion = "org.lwjgl:lwjgl-nfd:3.3.3"

    shadow(implementation(nfdVersion) {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-macos") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-linux") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-windows") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-macos-arm64") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-linux-arm64") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-windows-arm64") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
}

processResources {
    var replaceProperties = [
        minecraft_version      : project.minecraft_version,
        neo_version            : project.neo_version,
        neo_version_range      : project.neo_version_range,
        loader_version_range   : project.loader_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_license            : project.mod_license,
        mod_version            : project.mod_version,
        mod_authors            : project.mod_authors,
        mod_description        : project.mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : project.mod_id,
            'Specification-Vendor'    : project.mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.mod_version,
            'Implementation-Vendor'   : project.mod_authors,
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveBaseName = "flashback_reforged"
    destinationDirectory = file("${buildDir}/tmp/allJar")

    exclude("LICENSE")
    exclude("LICENSE.txt")
}

tasks.named('jar') {
    dependsOn shadowJar
    doLast {
        def mergeDir = layout.buildDirectory.dir('tmp/jarMergeShadow').get().asFile
        mergeDir.deleteDir()
        copy {
            from(zipTree(shadowJar.archiveFile))
            into(mergeDir)
            exclude 'LICENSE', 'LICENSE.txt'
            exclude 'META-INF/jarjar/**'
            exclude 'META-INF/mods.toml'
            exclude 'META-INF/neoforge.mods.toml'
            exclude 'assets/**'
            exclude 'data/**'
            exclude 'pack.mcmeta'
            exclude 'fabric.mod.json'
            exclude 'flashback.mixins.json'
            exclude '*.cfg'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
        ant.jar(update: true, destfile: archiveFile.get().asFile) {
            fileset(dir: mergeDir)
        }
        mergeDir.deleteDir()
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
